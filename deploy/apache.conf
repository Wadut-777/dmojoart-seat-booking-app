# Apache reverse proxy for the app. Enable once:  a2enmod proxy proxy_http headers
# Save as /etc/apache2/sites-available/dmojo.conf, then: a2ensite dmojo && systemctl reload apache2
<VirtualHost *:80>
    ServerName __DOMAIN__
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    LimitRequestBody 26214400
</VirtualHost>
# After running `certbot --apache -d __DOMAIN__`, change the X-Forwarded-Proto line in the
# generated *-le-ssl.conf to "https".
